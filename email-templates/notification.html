<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New portfolio message</title>
  <!--
    NOTIFICATION TEMPLATE  →  template_5mg3gzw
    Sent to: kamalkiranpolisetty@gmail.com (you)
    Variables: {{from_name}}, {{from_email}}, {{subject}}, {{message}}
  -->
</head>
<body style="margin:0;padding:0;background:#0c0c0c;font-family:Arial,sans-serif;">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#0c0c0c;padding:48px 20px;">
<tr><td align="center">
<table width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;">

  <!-- Eyebrow -->
  <tr><td style="padding-bottom:20px;">
    <span style="font-family:'Courier New',monospace;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#c7ff4a;">Portfolio &middot; New Message</span>
  </td></tr>

  <!-- Card -->
  <tr><td style="background:#151515;border:1px solid rgba(244,241,232,0.1);border-top:3px solid #c7ff4a;border-radius:16px;padding:44px 40px;">

    <!-- Arrow badge -->
    <div style="background:#c7ff4a;border-radius:50%;width:44px;height:44px;text-align:center;line-height:44px;font-size:20px;margin-bottom:32px;">&#8594;</div>

    <!-- Label -->
    <p style="margin:0 0 10px;font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:#c7ff4a;">Someone reached out</p>

    <!-- Headline -->
    <h1 style="margin:0 0 28px;font-size:30px;font-weight:700;line-height:1.2;letter-spacing:-0.02em;color:#f4f1e8;">New message from<br>your portfolio.</h1>

    <!-- Divider -->
    <hr style="border:0;border-top:1px solid rgba(244,241,232,0.08);margin:0 0 28px;">

    <!-- Sender details -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#1d1d1d;border:1px solid rgba(244,241,232,0.08);border-radius:10px;margin-bottom:20px;">
      <tr>
        <td style="padding:20px 24px;border-bottom:1px solid rgba(244,241,232,0.06);">
          <span style="font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#c7ff4a;display:block;margin-bottom:5px;">Name</span>
          <span style="font-size:15px;font-weight:600;color:#f4f1e8;">{{from_name}}</span>
        </td>
      </tr>
      <tr>
        <td style="padding:20px 24px;border-bottom:1px solid rgba(244,241,232,0.06);">
          <span style="font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#c7ff4a;display:block;margin-bottom:5px;">Email</span>
          <a href="mailto:{{from_email}}" style="font-size:15px;color:#c7ff4a;text-decoration:none;">{{from_email}}</a>
        </td>
      </tr>
      <tr>
        <td style="padding:20px 24px;">
          <span style="font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#c7ff4a;display:block;margin-bottom:5px;">Subject</span>
          <span style="font-size:15px;color:#f4f1e8;">{{subject}}</span>
        </td>
      </tr>
    </table>

    <!-- Message -->
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-bottom:32px;">
      <tr>
        <td style="background:#1d1d1d;border-left:3px solid #c7ff4a;border-radius:0 10px 10px 0;padding:20px 24px;">
          <span style="font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:#c7ff4a;display:block;margin-bottom:10px;">Message</span>
          <p style="margin:0;font-size:15px;color:#aaa89f;line-height:1.75;white-space:pre-wrap;">{{message}}</p>
        </td>
      </tr>
    </table>

    <!-- Reply CTA -->
    <a href="mailto:{{from_email}}" style="display:inline-block;background:#c7ff4a;color:#0c0c0c;font-family:'Courier New',monospace;font-size:10px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;text-decoration:none;padding:12px 22px;border-radius:6px;">Reply to {{from_name}} &#8599;</a>

  </td></tr>

  <!-- Footer -->
  <tr><td style="padding:28px 0 0;">
    <p style="margin:0;font-family:'Courier New',monospace;font-size:10px;letter-spacing:0.06em;color:#5c5a53;text-transform:uppercase;">Sent via contact form &middot; kamalkiranpolisetty.com</p>
  </td></tr>

</table>
</td></tr>
</table>
</body>
</html>
